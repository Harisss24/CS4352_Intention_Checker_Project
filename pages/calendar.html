<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23233a2a%22/%3E%3Cpath d=%22m8 16 5 5 11-11%22 fill=%22none%22 stroke=%22%2370d796%22 stroke-width=%223%22/%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121813">
  <meta name="description" content="Browse past app sessions by date and see where usage stayed within or exceeded the intended time.">
  <title>Calendar · Intention Checker</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/calendar.css">
  <script src="../js/navigation.js" defer></script>
  <script src="../js/session-data.js" defer></script>
  <script src="../js/calendar.js" defer></script>
</head>
<body data-page="calendar">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <header class="page-header"><h1>Calendar</h1></header>
    <main id="main" class="page-content calendar-page" tabindex="-1">
      <section class="notice compare-banner" id="compare-banner" hidden>
        <p id="compare-text"></p>
        <a class="button button-quiet" id="compare-cancel" href="session-details.html">Cancel comparison</a>
      </section>

      <section class="card calendar-card" aria-labelledby="month-label">
        <div class="month-nav">
          <button type="button" class="month-button" id="prev-month" aria-label="Previous month"><span aria-hidden="true">‹</span></button>
          <h2 id="month-label" aria-live="polite"></h2>
          <button type="button" class="month-button" id="next-month" aria-label="Next month"><span aria-hidden="true">›</span></button>
        </div>
        <p class="muted month-summary" id="month-summary"></p>
        <ul class="legend" aria-label="Legend">
          <li><span class="marker is-within" aria-hidden="true"></span>Within time</li>
          <li><span class="marker is-over" aria-hidden="true"></span>Exceeded time</li>
          <li><span class="marker is-none" aria-hidden="true"></span>No usage</li>
        </ul>
        <div class="weekdays" aria-hidden="true">
          <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
        </div>
        <div class="day-grid" id="day-grid" role="group" aria-labelledby="month-label"></div>
        <p class="muted grid-hint">Select a date to see its sessions. Arrow keys move between dates.</p>
      </section>

      <section class="card day-panel" id="day-panel" aria-live="polite" aria-labelledby="day-heading">
        <h2 id="day-heading"></h2>
        <p class="muted" id="day-summary"></p>
        <ul class="session-list" id="session-list"></ul>
      </section>

      <p class="muted demo-note">Demo data: sessions are sample history for usability testing, not real phone usage.</p>
      <noscript><p class="notice">JavaScript is off. The calendar needs JavaScript; <a href="../index.html">return to Home</a>.</p></noscript>
    </main>
    <nav class="bottom-nav" data-bottom-nav aria-label="Main navigation"></nav>
  </div>
</body>
</html>
